apiVersion: machinelearning.seldon.io/v1
kind: SeldonDeployment
metadata:
  labels:
    app: seldon
  name: model-1
spec:
  annotations:
    project_name: scikit
    deployment_version: "1"
  name: scikit-specs
  predictors:
      - componentSpecs:
        - spec:
            containers:
              - image: y2jay1/seldon-model:v1.0
                imagePullPolicy: IfNotPresent
                name: predictor
                env:
                  - name: MODEL_NAME
                    value: "Predictor"
                  - name: SERVICE_TYPE
                    value: MODEL
                  - name: GRPC_PORT
                    value: "5007"
                  - name: METRICS_PORT
                    value: "6007"
                  - name: HTTP_PORT
                    value: "9000"
          hpaSpec:
            maxReplicas: 2
            metrics:
              - resource:
                  name: cpu
                  targetAverageUtilization: 80
                type: Resource
            minReplicas: 1
        graph:
          children: []
          name: predictor
          type: MODEL
          endpoint:
            type: REST
            service_host: localhost
            service_port: 9000
          logger:
            url: http://logger/
            mode: all
        name: scikit-predictor
        annotations:
          predictor_version: "1"
          team: opendatahub
          seldon.io/svc-name: model-1-scikit
        labels:
          team: opendatahub
          version: v1
        replicas: 1
