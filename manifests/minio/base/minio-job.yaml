apiVersion: batch/v1
kind: Job
metadata:
#  namespace: ml-workshop
  name: minio-ml-workshop
  labels:
    helm.sh/chart: s3-server-0.0.1
    app.kubernetes.io/name: minio
    app.kubernetes.io/instance: min
    app.kubernetes.io/version: "0.0.1"
    app.kubernetes.io/managed-by: Helm
spec:
  template:
    metadata:
      name: minio-setup-ml-workshop
    spec:
      restartPolicy: OnFailure
      volumes:
        - name: config
          emptyDir: {}
        - configMap:
            defaultMode: 420
            name: modelconfig
          name: modelconfig
        - configMap:
            defaultMode: 420
            name: promconfig
          name: promconfig
      containers:
        - name: mc
          # minio/mc images were removed from Docker Hub (2025); aws-cli is used instead.
          image: docker.io/amazon/aws-cli:2.17.0
          imagePullPolicy: IfNotPresent
          env:
            - name: AWS_ACCESS_KEY_ID
              value: minio
            - name: AWS_SECRET_ACCESS_KEY
              value: minio123
            - name: AWS_DEFAULT_REGION
              value: us-east-1
            - name: AWS_REQUEST_CHECKSUM_CALCULATION
              value: when_required
            - name: AWS_RESPONSE_CHECKSUM_VALIDATION
              value: when_required
          command:
            - /bin/sh
            - -c
            - |
              set -e
              EP=http://minio-ml-workshop:9000
              S3="aws --endpoint-url $EP s3"
              until $S3 ls >/dev/null 2>&1; do echo "waiting for minio..."; sleep 5; done
              for b in data model-stats models rawdata mlflow airflow; do
                $S3 mb s3://$b 2>/dev/null || echo "bucket $b already exists"
              done
              aws --endpoint-url $EP s3api put-object --bucket model-stats --key tensordata/
              $S3 cp /tmp/models.config s3://models/models.config
              $S3 cp /tmp/prometheus_config.config s3://models/prometheus_config.config
              for b in rawdata mlflow airflow; do
                cat > /tmp/policy-$b.json <<POLICY
              {"Version":"2012-10-17","Statement":[
                {"Effect":"Allow","Principal":{"AWS":["*"]},"Action":["s3:GetBucketLocation","s3:ListBucket","s3:ListBucketMultipartUploads"],"Resource":["arn:aws:s3:::$b"]},
                {"Effect":"Allow","Principal":{"AWS":["*"]},"Action":["s3:GetObject","s3:PutObject","s3:DeleteObject","s3:ListMultipartUploadParts","s3:AbortMultipartUpload"],"Resource":["arn:aws:s3:::$b/*"]}
              ]}
              POLICY
                aws --endpoint-url $EP s3api put-bucket-policy --bucket $b --policy file:///tmp/policy-$b.json
              done
              echo "MinIO bootstrap complete"; $S3 ls
          volumeMounts:
            - name: config
              mountPath: "/config"
            - mountPath: /tmp/models.config
              name: modelconfig
              subPath: models.config
            - mountPath: /tmp/prometheus_config.config
              name: promconfig
              subPath: prometheus_config.config